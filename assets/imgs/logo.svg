<svg
  width="1000"
  height="1000"
  viewBox="0 0 512 512"
  xmlns="http://www.w3.org/2000/svg"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Top M -->
  <path
    d="
      M96 64
      H192
      L256 128
      L320 64
      H416
      V128
      H352
      L256 192
      L160 128
      H96
      Z
    "
    fill="#5A5A5A"
  />

  <!-- Left U -->
  <path
    d="
      M96 128
      V336
      C96 400 160 432 224 432
      V368
      C192 368 160 352 160 320
      V128
      Z
    "
    fill="#1a8e46"
  />

  <!-- Right G -->
  <path
    d="
      M416 128
      V256
      H304
      V320
      H352
      V336
      C352 352 336 368 304 368
      H256
      V432
      H304
      C368 432 416 400 416 336
      V128
      Z
    "
    fill="#5A5A5A"
  />

  <!-- Green block (touches M, same width as U) -->
  <rect
    x="352"
    y="128"
    width="64"
    height="64"
    fill="#1a8e46"
  />

  <!-- Brand name: always inside the logo.
       textLength forces the text to exactly fill the white area between the
       inner edge of the U (x=160, +12 margin) and the right edge (x=416),
       whatever font is installed. -->
  <text
    x="172"
    y="245"
    textLength="244"
    lengthAdjust="spacingAndGlyphs"
    font-size="65"
    font-weight="400"
    font-family="Agency FB, Arial Narrow, Arial, sans-serif"
    fill="#000000"
  >BalLieGus</text>

</svg>
